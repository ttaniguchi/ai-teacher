<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">個人開発向け知識グラフの紐付き評価</title>
  <desc id="desc">チケット、ファイル、決定、テスト、バグをノードとして、関係タイプ、根拠、重み、鮮度を使って検索時に有用な経路を評価する図。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#315f74"/>
    </marker>
    <style>
      .bg{fill:#f7fafb}
      .panel{fill:#fff;stroke:#c9d8df;stroke-width:2}
      .node{fill:#e8f1f4;stroke:#315f74;stroke-width:2}
      .decision{fill:#f3eadf;stroke:#8a6640;stroke-width:2}
      .test{fill:#e7efe2;stroke:#557a4b;stroke-width:2}
      .risk{fill:#f5e4e1;stroke:#a15a4d;stroke-width:2}
      .line{stroke:#315f74;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .weak{stroke:#8fa4ad;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17313f}
      .label{font-size:23px;font-weight:700}
      .small{font-size:17px}
      .tiny{font-size:14px;fill:#4f6772}
      .score{font-size:15px;font-weight:700;fill:#315f74}
    </style>
  </defs>
  <rect class="bg" width="960" height="560" rx="28"/>
  <rect class="panel" x="34" y="32" width="892" height="464" rx="18"/>

  <rect class="node" x="64" y="210" width="170" height="94" rx="15"/>
  <text class="text label" x="149" y="247" text-anchor="middle">Ticket</text>
  <text class="text tiny" x="149" y="275" text-anchor="middle">T-142 認証修正</text>

  <rect class="node" x="312" y="72" width="170" height="94" rx="15"/>
  <text class="text label" x="397" y="109" text-anchor="middle">File</text>
  <text class="text tiny" x="397" y="137" text-anchor="middle">auth/session.ts</text>

  <rect class="decision" x="312" y="210" width="170" height="94" rx="15"/>
  <text class="text label" x="397" y="247" text-anchor="middle">Decision</text>
  <text class="text tiny" x="397" y="275" text-anchor="middle">D-031 方針</text>

  <rect class="test" x="312" y="348" width="170" height="94" rx="15"/>
  <text class="text label" x="397" y="385" text-anchor="middle">Test</text>
  <text class="text tiny" x="397" y="413" text-anchor="middle">session.spec.ts</text>

  <rect class="risk" x="608" y="72" width="170" height="94" rx="15"/>
  <text class="text label" x="693" y="109" text-anchor="middle">Bug</text>
  <text class="text tiny" x="693" y="137" text-anchor="middle">B-019 再発</text>

  <rect class="node" x="608" y="348" width="170" height="94" rx="15"/>
  <text class="text label" x="693" y="385" text-anchor="middle">Spec</text>
  <text class="text tiny" x="693" y="413" text-anchor="middle">SSO仕様</text>

  <path class="line" d="M234 232 C264 190 282 150 304 128"/>
  <text class="text score" x="260" y="171">touches 0.8</text>

  <path class="line" d="M234 257 H304"/>
  <text class="text score" x="250" y="245">decided_by 1.0</text>

  <path class="line" d="M234 282 C263 322 282 362 304 386"/>
  <text class="text score" x="252" y="345">tested_by 0.9</text>

  <path class="line" d="M482 118 H600"/>
  <text class="text score" x="512" y="106">previously_broke 0.7</text>

  <path class="line" d="M482 395 H600"/>
  <text class="text score" x="522" y="383">covers 0.8</text>

  <path class="weak" d="M482 257 C558 250 607 205 650 166"/>
  <text class="text tiny" x="548" y="237">weak: mentioned_with</text>

  <rect class="panel" x="70" y="468" width="820" height="54" rx="12"/>
  <text class="text small" x="480" y="490" text-anchor="middle">評価はDBが自動で決めるのではなく、関係タイプ・根拠・重み・鮮度を検索時に足し合わせる</text>
  <text class="text tiny" x="480" y="512" text-anchor="middle">強い関係は近く、弱い関係は候補に留める。因果と共起を混ぜない。</text>
</svg>
