<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer architecture overview</title>
  <desc id="desc">Tokens are embedded with position information, passed through stacked self-attention and feed-forward layers, and decoded with attention over encoder output.</desc>
  <rect width="980" height="620" fill="#fffdf8"/>

  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">Transformerの全体像</text>
  <text x="490" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5f6368">単語を順番に読む代わりに、各トークンが他のトークンを直接見に行く</text>

  <rect x="62" y="110" width="222" height="70" rx="8" fill="#f8ede0" stroke="#b45309" stroke-width="2"/>
  <text x="173" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124">入力トークン</text>
  <text x="173" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">例: 私 / は / 本 / を / 読む</text>

  <rect x="62" y="220" width="222" height="70" rx="8" fill="#eef7ff" stroke="#2563eb" stroke-width="2"/>
  <text x="173" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124">埋め込み + 位置情報</text>
  <text x="173" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">意味ベクトルに語順を足す</text>

  <rect x="374" y="104" width="254" height="234" rx="10" fill="#f7f4ee" stroke="#ded8cc" stroke-width="2"/>
  <text x="501" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124">EncoderをN層積む</text>
  <rect x="402" y="162" width="198" height="56" rx="8" fill="#d8f3ef" stroke="#0f766e" stroke-width="2"/>
  <text x="501" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124">Multi-Head Self-Attention</text>
  <rect x="402" y="248" width="198" height="56" rx="8" fill="#eef7ff" stroke="#2563eb" stroke-width="2"/>
  <text x="501" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124">Feed Forward</text>
  <text x="501" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">各サブ層に残差接続 + LayerNorm</text>

  <rect x="696" y="104" width="222" height="234" rx="10" fill="#f7f4ee" stroke="#ded8cc" stroke-width="2"/>
  <text x="807" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124">DecoderをN層積む</text>
  <rect x="724" y="158" width="166" height="48" rx="8" fill="#d8f3ef" stroke="#0f766e" stroke-width="2"/>
  <text x="807" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Masked Self-Attention</text>
  <rect x="724" y="224" width="166" height="48" rx="8" fill="#f8ede0" stroke="#b45309" stroke-width="2"/>
  <text x="807" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Encoder-Decoder Attention</text>
  <rect x="724" y="290" width="166" height="48" rx="8" fill="#eef7ff" stroke="#2563eb" stroke-width="2"/>
  <text x="807" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Feed Forward</text>

  <rect x="696" y="396" width="222" height="70" rx="8" fill="#f8ede0" stroke="#b45309" stroke-width="2"/>
  <text x="807" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124">次のトークンを予測</text>
  <text x="807" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">翻訳文を1語ずつ生成</text>

  <path d="M173 180 V216" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M284 255 H370" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M628 221 H692" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M807 338 V392" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M501 338 C501 384 692 372 756 292" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/>

  <rect x="76" y="408" width="536" height="126" rx="8" fill="#ffffff" stroke="#ded8cc" stroke-width="2"/>
  <text x="344" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202124">Self-Attentionの考え方</text>
  <text x="128" y="476" font-family="Arial, sans-serif" font-size="15" fill="#202124">Query: 今のトークンが「何を探すか」</text>
  <text x="128" y="506" font-family="Arial, sans-serif" font-size="15" fill="#202124">Key: 他のトークンが「何の手がかりを持つか」</text>
  <text x="128" y="536" font-family="Arial, sans-serif" font-size="15" fill="#202124">Value: 実際に集めて混ぜる情報</text>
  <path d="M424 486 C466 456 514 456 556 486" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <path d="M424 516 C480 554 532 554 588 516" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="114" y="568" width="752" height="30" rx="8" fill="#d8f3ef" stroke="#0f766e" stroke-width="1.5"/>
  <text x="490" y="589" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#115e59">並列処理しやすく、遠い単語同士の関係も短い経路で扱える</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
