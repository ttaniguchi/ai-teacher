<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">AWSでWebサーバーとDBサーバーを分離するVPC構成</title>
  <desc id="desc">Route 53、CloudFront、WAF、Application Load Balancer、EC2、RDS、Internet Gateway、NAT Gateway、VPC Endpoint、Security Groupを使った三層構成のネットワーク図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4f4f"/>
    </marker>
    <style>
      .bg { fill: #fffdf8; }
      .vpc { fill: #f6faf8; stroke: #0f766e; stroke-width: 3; }
      .az { fill: #ffffff; stroke: #b7d7d2; stroke-width: 2; stroke-dasharray: 8 8; }
      .public { fill: #e8f5ff; stroke: #3b82f6; }
      .private { fill: #e9f8ef; stroke: #16a34a; }
      .isolated { fill: #fff2e1; stroke: #d97706; }
      .service { fill: #ffffff; stroke: #8d8578; stroke-width: 2; }
      .edge { fill: #f3ecff; stroke: #7c3aed; stroke-width: 2; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #202124; }
      .small { font: 600 16px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #202124; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #4b5563; }
      .path { fill: none; stroke: #2f4f4f; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1120" height="760" rx="18"/>

  <rect class="edge" x="40" y="42" width="190" height="74" rx="12"/>
  <text class="small" x="135" y="74" text-anchor="middle">Route 53</text>
  <text class="tiny" x="135" y="98" text-anchor="middle">DNS / ドメイン名解決</text>

  <rect class="edge" x="280" y="42" width="190" height="74" rx="12"/>
  <text class="small" x="375" y="74" text-anchor="middle">CloudFront + WAF</text>
  <text class="tiny" x="375" y="98" text-anchor="middle">CDN / L7防御</text>

  <rect class="service" x="525" y="42" width="170" height="74" rx="12"/>
  <text class="small" x="610" y="74" text-anchor="middle">Internet Gateway</text>
  <text class="tiny" x="610" y="98" text-anchor="middle">VPCのインターネット口</text>

  <path class="path" d="M230 79 H280"/>
  <path class="path" d="M470 79 H525"/>

  <rect class="vpc" x="46" y="150" width="1028" height="560" rx="18"/>
  <text class="label" x="72" y="186">VPC 10.0.0.0/16</text>
  <text class="tiny" x="72" y="212">VPC内はlocal routeで相互到達。外向き経路はRoute Tableで決める。</text>

  <rect class="az" x="78" y="240" width="465" height="420" rx="14"/>
  <text class="small" x="102" y="272">Availability Zone A</text>
  <rect class="az" x="577" y="240" width="465" height="420" rx="14"/>
  <text class="small" x="601" y="272">Availability Zone B</text>

  <rect class="public" x="104" y="300" width="192" height="86" rx="12"/>
  <text class="small" x="200" y="332" text-anchor="middle">Public Subnet</text>
  <text class="tiny" x="200" y="356" text-anchor="middle">ALB node / NAT GW</text>
  <text class="tiny" x="200" y="376" text-anchor="middle">0.0.0.0/0 -> IGW</text>

  <rect class="public" x="606" y="300" width="192" height="86" rx="12"/>
  <text class="small" x="702" y="332" text-anchor="middle">Public Subnet</text>
  <text class="tiny" x="702" y="356" text-anchor="middle">ALB node / NAT GW</text>
  <text class="tiny" x="702" y="376" text-anchor="middle">0.0.0.0/0 -> IGW</text>

  <rect class="service" x="364" y="288" width="176" height="94" rx="12"/>
  <text class="small" x="452" y="322" text-anchor="middle">Application</text>
  <text class="small" x="452" y="346" text-anchor="middle">Load Balancer</text>
  <text class="tiny" x="452" y="370" text-anchor="middle">ELB / Listener / TG</text>

  <rect class="private" x="104" y="430" width="192" height="86" rx="12"/>
  <text class="small" x="200" y="462" text-anchor="middle">Private Subnet</text>
  <text class="tiny" x="200" y="486" text-anchor="middle">EC2 / ECS tasks</text>
  <text class="tiny" x="200" y="506" text-anchor="middle">0.0.0.0/0 -> NAT GW</text>

  <rect class="private" x="606" y="430" width="192" height="86" rx="12"/>
  <text class="small" x="702" y="462" text-anchor="middle">Private Subnet</text>
  <text class="tiny" x="702" y="486" text-anchor="middle">EC2 / ECS tasks</text>
  <text class="tiny" x="702" y="506" text-anchor="middle">0.0.0.0/0 -> NAT GW</text>

  <rect class="isolated" x="104" y="560" width="192" height="74" rx="12"/>
  <text class="small" x="200" y="592" text-anchor="middle">DB Subnet</text>
  <text class="tiny" x="200" y="616" text-anchor="middle">RDS primary候補</text>

  <rect class="isolated" x="606" y="560" width="192" height="74" rx="12"/>
  <text class="small" x="702" y="592" text-anchor="middle">DB Subnet</text>
  <text class="tiny" x="702" y="616" text-anchor="middle">RDS standby候補</text>

  <rect class="service" x="852" y="304" width="150" height="78" rx="12"/>
  <text class="small" x="927" y="336" text-anchor="middle">NAT Gateway</text>
  <text class="tiny" x="927" y="360" text-anchor="middle">外向き通信専用</text>

  <rect class="service" x="850" y="430" width="154" height="86" rx="12"/>
  <text class="small" x="927" y="462" text-anchor="middle">VPC Endpoint</text>
  <text class="tiny" x="927" y="486" text-anchor="middle">S3 / ECR / SSM等</text>
  <text class="tiny" x="927" y="506" text-anchor="middle">AWS APIへ閉域接続</text>

  <rect class="service" x="364" y="552" width="176" height="88" rx="12"/>
  <text class="small" x="452" y="584" text-anchor="middle">Amazon RDS</text>
  <text class="tiny" x="452" y="608" text-anchor="middle">DB Subnet Group</text>
  <text class="tiny" x="452" y="628" text-anchor="middle">Multi-AZ配置</text>

  <path class="path" d="M610 116 V150"/>
  <path class="path" d="M610 150 C610 230 552 252 504 288"/>
  <path class="path" d="M452 382 C400 416 315 426 248 430"/>
  <path class="path" d="M452 382 C505 416 588 426 654 430"/>
  <path class="path" d="M248 516 C297 552 327 578 364 590"/>
  <path class="path" d="M654 516 C602 552 574 578 540 590"/>
  <path class="dashed" d="M296 473 H606"/>
  <path class="dashed" d="M798 473 H850"/>
  <path class="dashed" d="M798 343 H852"/>
  <path class="dashed" d="M927 304 C914 210 730 208 650 150"/>

  <rect class="service" x="74" y="674" width="946" height="28" rx="8"/>
  <text class="tiny" x="547" y="693" text-anchor="middle">Security Group: ALB SGは80/443を受け、Web SGはALB SGからのアプリポートだけ、DB SGはWeb SGからのDBポートだけ許可する。</text>
</svg>
