<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Turborepo monorepo layout</title>
  <desc id="desc">pnpm workspace bundles packages; Turborepo runs build, lint, and test with caching and parallelism.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Turborepo + pnpm workspace</text>

  <rect x="40" y="60" width="200" height="300" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">apps/</text>
  <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">web (Next.js)</text>
  <text x="140" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">api (Hono)</text>
  <text x="140" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">docs (Astro)</text>

  <rect x="260" y="60" width="200" height="300" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#78350f">packages/</text>
  <text x="360" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">ui</text>
  <text x="360" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">database</text>
  <text x="360" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">api-types</text>
  <text x="360" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">config (ts/biome)</text>

  <rect x="480" y="60" width="200" height="300" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4c1d95">turbo.json</text>
  <text x="580" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">build</text>
  <text x="580" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">lint</text>
  <text x="580" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">test</text>
  <text x="580" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">dev</text>
  <text x="580" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">キャッシュ・並列・依存順</text>

  <path d="M240 180 H260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460 180 H480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">apps は packages を workspace 参照し、Turbo がタスクを実行</text>
</svg>
